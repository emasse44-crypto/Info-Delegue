plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.infodelegue.app'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.infodelegue.app'
        minSdk 31
        targetSdk 28
        versionCode 4
        versionName '1.3-Android12-15'
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}

tasks.register('copyInfoDelegueSite', Copy) {
    from(rootProject.projectDir.parentFile) {
        include 'index.html'
        include 'reglement.html'
        include 'manifest.webmanifest'
        include '*.pdf'
        include 'reglement/**'
        include 'documents/**'
    }
    into layout.buildDirectory.dir('generated/infoDelegueAssets/site')
    doLast {
        fileTree(layout.buildDirectory.dir('generated/infoDelegueAssets/site')).matching {
            include '**/*.html'
        }.files.each { html ->
            def source = html.getText('UTF-8')
            source = source.replaceAll(/(?i)\s+target\s*=\s*["']_blank["']/, '')
            source = source.replaceAll(/(?i)\s+rel\s*=\s*["']noopener["']/, '')
            html.write(source, 'UTF-8')
        }
    }
}
tasks.named('preBuild').configure {
    dependsOn tasks.named('copyInfoDelegueSite')
}
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/infoDelegueAssets'))
