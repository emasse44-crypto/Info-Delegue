name: Build APK Info Délégué

on:
  push:
    paths:
      - 'android-apk/**'
      - '.github/workflows/build-info-delegue-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Installer Android SDK
        uses: android-actions/setup-android@v3
      - name: Construire l’APK Android 8+
        working-directory: android-apk
        run: gradle --no-daemon assembleDebug
      - name: Publier l’APK
        uses: actions/upload-artifact@v4
        with:
          name: Info-Delegue-Android8-APK
          path: android-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
